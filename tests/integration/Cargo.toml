compliance = { path = "../../contracts/compliance" }
identity-registry = { path = "../../contracts/identity-registry" }
identity-verifier = { path = "../../contracts/identity-verifier" }
claim-topics-and-issuers = { path = "../../contracts/claim-topics-and-issuers" }
