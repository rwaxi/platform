# Verifiable builds (SEP-55): on a tag, builds each contract in GitHub Actions,
# attests the WASM hash and publishes it as a release asset. Stellar Expert then
# shows each deployed contract as built from this repository.
# Deploy from these release assets, not from a local build.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  id-token: write
  contents: write
  attestations: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        package:
          - rwa-token
          - compliance
          - identity-registry
          - identity-verifier
          - claim-topics-and-issuers
          - claim-issuer
          - investor-identity
          - reg-s-distribution-period
    uses: stellar-expert/soroban-build-workflow/.github/workflows/release.yml@v28.1.0
    with:
      release_name: ${{ github.ref_name }}-${{ matrix.package }}
      release_description: "RWAXI platform: ${{ matrix.package }}"
      package: ${{ matrix.package }}
    secrets:
      release_token: ${{ secrets.GITHUB_TOKEN }}
